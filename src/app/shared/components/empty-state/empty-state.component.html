<div class="empty-state">
  <div class="empty-icon">{{ icon }}</div>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-message" *ngIf="message">{{ message }}</p>
  <button type="button" class="empty-action" *ngIf="actionLabel" (click)="action.emit()">
    {{ actionLabel }}
  </button>
</div>
