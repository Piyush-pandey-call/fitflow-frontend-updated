<div class="dialog-backdrop" *ngIf="open" (click)="cancel.emit()">
  <div class="dialog-box" (click)="$event.stopPropagation()">
    <h3 class="dialog-title">{{ title }}</h3>
    <p class="dialog-message">{{ message }}</p>

    <div class="dialog-actions">
      <button type="button" class="dialog-btn-cancel" (click)="cancel.emit()" [disabled]="isProcessing">
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="dialog-btn-confirm"
        [class.danger]="danger"
        (click)="confirm.emit()"
        [disabled]="isProcessing"
      >
        {{ isProcessing ? 'Please wait…' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
