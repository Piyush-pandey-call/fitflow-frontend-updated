<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-mark">FitFlow</span>
      <p class="auth-subtitle">Reset your password</p>
    </div>

    <div class="auth-error" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <ng-container *ngIf="!submitted(); else sentTpl">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            [class.invalid]="email.invalid && email.touched"
          />
          <span class="field-error" *ngIf="email.invalid && email.touched"> Enter a valid email address </span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          <span *ngIf="!isSubmitting()">Send Reset Link</span>
          <span *ngIf="isSubmitting()">Sending…</span>
        </button>
      </form>
    </ng-container>

    <ng-template #sentTpl>
      <div class="auth-success">
        If an account with that email exists, a reset link has been sent. Please check your inbox.
      </div>
    </ng-template>

    <p class="auth-switch">
      Remembered your password?
      <a routerLink="/auth/login">Back to login</a>
    </p>
  </div>
</div>
